<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Session Generator</title>
<style>
body {
  font-family: Arial;
  background: #f1f4f8;
  padding: 20px;
  max-width: 750px;
  margin: auto;
}
textarea,input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #bbb;
  border-radius: 6px;
}
button {
  background: #087dcc;
  color: white;
  border: 0;
  padding: 12px 18px;
  margin: 5px 3px;
  border-radius: 5px;
  cursor: pointer;
}
.result {
  background: white;
  padding: 12px;
  margin: 8px 0;
  overflow-wrap: anywhere;
  border-radius: 6px;
}
</style>
</head>
<body>

<h2>Random Proxy Session Generator</h2>

<label>Original Proxy URL</label>
<textarea id="url" rows="4">http://b2b0id3mpkykfleq:aLLtqHwGr3uFPczBACC5Cb4T-country-US-session-K7mP2xQ9-duration-30@us-east.gw.rayobyte.com:8000</textarea>

<label>Number of Links</label>
<input type="number" id="count" value="50" min="1" max="1000">

<button onclick="generate()">Generate Links</button>
<button onclick="copyAll()">Copy All Links</button>
<button onclick="download()">Download TXT</button>

<h3 id="total"></h3>
<div id="results"></div>

<script>
let generated = [];

function randomID(length = 8) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  const bytes = crypto.getRandomValues(
    new Uint8Array(length)
  );

  return Array.from(bytes, b => chars[b % chars.length]).join("");
}

function generate() {
  const original = document.getElementById("url").value.trim();
  const count = Number(document.getElementById("count").value);

  const pattern = /-session-([^-@]+)(?=-|@)/;

  if (!pattern.test(original)) {
    alert("Session ID not found!");
    return;
  }

  if (!Number.isInteger(count) || count < 1 || count > 1000) {
    alert("Enter a number between 1 and 1000");
    return;
  }

  generated = [];
  const ids = new Set();

  while (ids.size < count) {
    ids.add(randomID());
  }

  for (const id of ids) {
    generated.push(
      original.replace(pattern, "-session-" + id)
    );
  }

  const results = document.getElementById("results");
  results.replaceChildren();

  generated.forEach((link, i) => {
    const div = document.createElement("div");
    div.className = "result";

    const txt = document.createElement("p");
    txt.textContent = link;

    const btn = document.createElement("button");
    btn.textContent = "Copy";
    btn.onclick = () =>
      navigator.clipboard.writeText(link);

    div.append(txt, btn);
    results.appendChild(div);
  });

  document.getElementById("total").textContent =
    generated.length + " Links Generated Successfully";
}

async function copyAll() {
  if (!generated.length) {
    alert("Generate links first");
    return;
  }

  const allLinks = generated.join("\n");

  try {
    await navigator.clipboard.writeText(allLinks);
    alert(generated.length + " links copied successfully!");
  } catch (err) {
    const textarea = document.createElement("textarea");
    textarea.value = allLinks;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();

    alert(generated.length + " links copied successfully!");
  }
}

function download() {
  if (!generated.length) return alert("Generate links first");

  const blob = new Blob([generated.join("\n")], {
    type: "text/plain"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "proxy-links.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
